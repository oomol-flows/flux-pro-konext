title: "%test-kontext-workflow%"
nodes:
  - node_id: submit#1
    task: self::submit_kontext_request
    inputs_from:
      - handle: image_url
        from_node:
          - node_id: upload-to-cloud#1
            output_handle: remote_url
      - handle: prompt
        value: "A beautiful landscape"

  - node_id: poll#1
    task: self::poll_kontext_result
    inputs_from:
      - handle: request_id
        from_node:
          - node_id: submit#1
            output_handle: request_id
      - handle: max_attempts
        value: 30
      - handle: poll_interval
        value: 2
  - node_id: upload-to-cloud#1
    title: "%1%"
    inputs_from:
      - handle: file
        value: /oomol-driver/oomol-storage/ooimage.jpg
    task: upload-to-cloud::upload-to-cloud
