title: "%test-kontext-workflow%"
description: "Upload a local image file and edit it with Flux Pro Kontext AI"
nodes:
  - node_id: submit#1
    task: self::submit_kontext_request
    inputs_from:
      - handle: image_url
        from_node:
          - node_id: upload-to-cloud#1
            output_handle: remote_url
      - handle: prompt
        value: "A beautiful landscape"
        from_flow:
          - input_handle: prompt

  - node_id: poll#1
    task: self::poll_kontext_result
    inputs_from:
      - handle: request_id
        from_node:
          - node_id: submit#1
            output_handle: request_id
      - handle: max_attempts
        value: 30
      - handle: poll_interval
        value: 2
  - node_id: upload-to-cloud#1
    title: "%1%"
    inputs_from:
      - handle: file
        value: /oomol-driver/oomol-storage/ooimage.jpg
        from_flow:
          - input_handle: file
    task: upload-to-cloud::upload-to-cloud
  - node_id: file-downloader#1
    title: "下载文件 #1"
    inputs_from:
      - handle: url
        from_node:
          - node_id: poll#1
            output_handle: image_url
      - handle: saved_path
        value: null
        from_flow:
          - input_handle: saved_path
      - handle: if_existing
        value: override
      - handle: threads_count
        value: 1
      - handle: headers
        value:
          {}
      - handle: cookies
        value:
          {}
      - handle: window_width
        value: 7
      - handle: failure_ladder
        value:
          - 5
      - handle: min_segment_length
        value: 1048576
      - handle: once_fetch_size
        value: 16384
      - handle: timeout
        value: 30
      - handle: retry_times
        value: 0
      - handle: retry_sleep
        value: 0
    subflow: downloader::file-downloader
inputs_def:
  - handle: file
    description: "Local image file to edit"
    json_schema:
      type: string
      ui:widget: file
    value: /oomol-driver/oomol-storage/ooimage.jpg
    nullable: false
    executor_name: nodejs
  - handle: prompt
    description: "Editing instructions for the AI model"
    json_schema:
      type: string
      ui:widget: text
    value: A beautiful landscape
    nullable: false
    executor_name: python
  - handle: saved_path
    description: "Path to save the edited image (optional)"
    json_schema:
      type: string
      ui:widget: save
    nullable: true
    value:
    executor_name: python
outputs_def:
  - handle: saved_path
    json_schema:
      type: string
      ui:widget: save
    nullable: false
    description: Path of the successfully downloaded file
    executor_name: python
outputs_from:
  - handle: saved_path
    from_node:
      - node_id: file-downloader#1
        output_handle: saved_path
