inputs_def:
  - handle: request_id
    description: "%the-request-id-to-poll-for-results%"
    json_schema:
      type: string
    nullable: false
  - group: Optional
    collapsed: true
  - handle: max_attempts
    description: "%maximum-number-of-polling-attempts-default-60%"
    json_schema:
      type: number
    value:
    nullable: true
  - handle: poll_interval
    description: "%seconds-to-wait-between-polling-attempts-default-2%"
    json_schema:
      type: number
    value:

    nullable: true
outputs_def:
  - handle: image_url
    description: "%the-url-of-the-processed-image%"
    json_schema:
      type: string
  - handle: status
    description: "%the-final-status-of-the-request%"
    json_schema:
      type: string

executor:
  name: python
  options:
    entry: __init__.py
    spawn: false

title: "%poll-kontext-result%"
icon: ":carbon:renew:"
description: "%poll-the-fal-flux-pro-kontext-api-for-the-result-of-a-submitted%"
private: true
