inputs_def:
  - handle: image_url
    description: "%url-of-the-image-to-process%"
    json_schema:
      type: string
    nullable: false
  - handle: prompt
    description: "%the-prompt-describing-the-desired-transformation%"
    json_schema:
      type: string
      ui:widget: text
    nullable: false

outputs_def:
  - handle: request_id
    description: "%the-request-id-returned-from-the-api-for-polling%"
    json_schema:
      type: string

executor:
  name: python
  options:
    entry: __init__.py
    spawn: false

title: "%submit-kontext-request%"
icon: ":carbon:send-alt:"
description: "%submit-an-image-processing-request-to-the-fal-flux-pro-kontext-a%"
